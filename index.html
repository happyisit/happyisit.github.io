<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HappyisIT | Small apps for your day</title>
<meta name="description" content="HappyisIT makes offline-first apps that need no sign-up and keep your data only on your device.">
<meta property="og:title" content="HappyisIT">
<meta property="og:description" content="Small apps for your day. Offline first, no sign-up, stored only on your device.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://happyisit.github.io/">
<meta name="theme-color" content="#1b1640">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232a2163'/%3E%3Ccircle cx='19' cy='21' r='12' fill='%23f6c9e0'/%3E%3Ccircle cx='25' cy='16' r='10' fill='%232a2163'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Serif:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#f6c9e0;--text:#efeaff;--muted:#c5bce8;--dim:#a79ed4;--line:rgba(255,255,255,.13)}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans KR","Noto Sans TC",system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,#1b1640 0%,#2a2163 25%,#3b2b6e 50%,#2a2163 75%,#1a1538 100%);min-height:100vh;overflow-x:hidden;line-height:1.6}
html[lang="zh-Hant"] body{font-family:"Noto Sans TC","Noto Sans KR",system-ui,sans-serif}
.serif{font-family:"Noto Serif KR","Noto Serif TC","Noto Serif",Georgia,serif}
html[lang="zh-Hant"] .serif{font-family:"Noto Serif TC","Noto Serif KR",serif}
html[lang="en"] .serif,html[lang="es"] .serif,html[lang="pt"] .serif,html[lang="ru"] .serif{font-family:"Noto Serif",Georgia,serif}
a{color:inherit;text-decoration:none}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.glow{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:min(1180px,100% - 40px);margin:0 auto}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(27,22,64,.55);border-bottom:1px solid rgba(255,255,255,.06)}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.logo{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:700;white-space:nowrap}
.menu{display:flex;gap:32px;font-size:15px;color:var(--muted)}
.menu a:hover{color:#fff}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:4px;border-radius:999px;font-size:13px;overflow-x:auto;scrollbar-width:none}
.lang::-webkit-scrollbar{display:none}
.lang button{border:0;background:none;color:#bdb3e6;padding:6px 11px;border-radius:999px;cursor:pointer;font:inherit;white-space:nowrap}
.lang button:hover{color:#fff}
.lang button[aria-pressed="true"]{background:var(--pink);color:#3b2763;font-weight:700}
.hero{text-align:center;padding:96px 0 100px;position:relative}
.moon{position:absolute;right:10px;top:30px;width:150px;height:150px}
.chip{display:inline-block;padding:8px 18px;border-radius:999px;border:1px solid rgba(246,201,224,.4);color:var(--pink);font-size:14px;background:rgba(246,201,224,.08)}
h1{font-size:clamp(38px,6vw,70px);line-height:1.3;font-weight:700;margin:28px 0 24px;letter-spacing:-.5px}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffc6e1,#d9c5ff,#a9dcff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(16px,1.6vw,20px);color:var(--muted);line-height:1.85;max-width:760px;margin:0 auto}
.cta{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:42px}
.btn{padding:15px 30px;border-radius:999px;font-size:16px;font-weight:700;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.b1{background:linear-gradient(135deg,#ffc6e1,#c7b3ff);color:#2d1f5a;box-shadow:0 0 40px rgba(255,190,225,.35)}
.b2{border:1px solid rgba(255,255,255,.3)}
section{scroll-margin-top:80px}
.sec{padding:80px 0}
.eyebrow{text-align:center;color:var(--pink);font-size:13px;letter-spacing:4px;font-weight:500}
h2{text-align:center;font-size:clamp(28px,3.4vw,42px);margin:14px 0;font-weight:700}
.lead{text-align:center;color:#b2a8da;font-size:17px;margin-bottom:52px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.app{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:28px;padding:32px;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,border-color .3s}
.app:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.28)}
.app:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;top:-70px;right:-60px;background:var(--c);opacity:.28;filter:blur(30px)}
.icon{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:22px;background:var(--c);box-shadow:0 0 28px var(--c);overflow:hidden;position:relative}
.icon img{width:100%;height:100%;object-fit:cover}
.app h3{font-size:22px;font-weight:700}
.app .en{font-size:12px;letter-spacing:2px;color:var(--dim);margin:2px 0 12px;text-transform:uppercase}
.app p{font-size:15.5px;color:#cbc2ec;line-height:1.75;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tags span{font-size:12.5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.08);color:#d9d1f5}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.links a{font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#e3dcff}
.links a:hover{background:rgba(255,255,255,.1)}
.links a.play{background:var(--c);border-color:transparent;color:#2d1f5a;font-weight:700}
.msg{text-align:center;color:var(--dim);padding:30px}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.pc{text-align:center;padding:34px 24px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1)}
.pc .ic{width:62px;height:62px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1)}
.pc h4{font-size:19px;margin-bottom:10px}
.pc p{font-size:14.5px;color:#bdb3e6;line-height:1.75}
.note{margin-top:22px;display:flex;gap:16px;align-items:flex-start;padding:22px 26px;border-radius:20px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.16)}
.note b{display:block;font-size:15px;margin-bottom:4px;color:#e3dcff}
.note p{font-size:14px;color:var(--dim);line-height:1.75}
.nums{display:grid;grid-template-columns:repeat(4,1fr);padding:46px 20px;border-radius:32px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.n{text-align:center}
.n b{display:block;font-size:clamp(38px,4.5vw,54px);line-height:1.2;background:linear-gradient(135deg,#ffc6e1,#a9dcff);-webkit-background-clip:text;background-clip:text;color:transparent}
.n span{color:#bdb3e6;font-size:15px}
.letter{text-align:center;padding:30px 0}
.letter q{font-size:clamp(21px,2.4vw,30px);line-height:1.8;quotes:none;display:block;max-width:900px;margin:0 auto}
.letter small{display:block;margin-top:24px;color:var(--pink);letter-spacing:1px;font-size:14px}
footer{position:relative;z-index:1;padding:56px 0 70px;text-align:center;color:var(--dim);font-size:14px;border-top:1px solid rgba(255,255,255,.1)}
footer .q{font-size:21px;font-weight:700;color:var(--text)}
.mail{display:inline-block;margin:16px 0;padding:13px 28px;border-radius:999px;background:rgba(246,201,224,.14);color:#ffd3e8;font-weight:700}
.mail:hover{background:rgba(246,201,224,.24)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease}
.reveal.on{opacity:1;transform:none}
.nt-back{position:fixed;inset:0;z-index:100;background:rgba(10,7,30,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .3s ease}
.nt-back[hidden]{display:none}
.nt{position:relative;width:min(780px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:28px;background:linear-gradient(180deg,#352a78,#251d5a);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 60px rgba(246,201,224,.15);overflow:hidden;animation:pop .35s ease}
.nt-head{padding:30px 34px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.nt-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;background:#ff8fb1;color:#3b1530;font-size:13px;font-weight:700}
.nt-head h3{font-size:clamp(22px,3vw,30px);line-height:1.4;margin-top:14px}
.nt-date{font-size:13px;color:var(--dim);margin-top:6px}
.nt-body{padding:24px 34px;overflow-y:auto;font-size:16.5px;line-height:1.9;color:#e3dcff;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.nt-body a{color:#ffd3e8;text-decoration:underline}
.nt-foot{padding:18px 34px 26px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:flex-end}
.nt-btn{border:0;cursor:pointer;font:inherit;font-weight:700;padding:13px 30px;border-radius:999px;font-size:15px}
.nt-close{background:linear-gradient(135deg,#ffc6e1,#c7b3ff);color:#2d1f5a}
.nt-x{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer}
.nt-ask{position:absolute;inset:0;background:rgba(20,14,50,.82);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s ease}
.nt-ask[hidden]{display:none}
.nt-ask-box{background:#fff;color:#2d1f5a;border-radius:24px;padding:30px 28px 24px;width:min(400px,100%);text-align:center;animation:pop .25s ease}
.nt-ask-box p{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:22px}
.nt-ask-row{display:flex;gap:10px}
.nt-ask-row button{flex:1}
.nt-no{background:#eee8ff;color:#5b4699}
.nt-yes{background:linear-gradient(135deg,#ff9fc4,#b49bff);color:#fff}
.nt.shake{animation:shake .4s}
body.locked{overflow:hidden}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@media (max-width:980px){.how{grid-template-columns:repeat(2,1fr)}.menu{display:none}.moon{width:100px;height:100px;top:10px;right:0;opacity:.7}}
@media (max-width:640px){
  nav{height:auto;padding:12px 0;flex-wrap:wrap}
  .lang{width:100%;justify-content:space-between}
  .hero{padding:60px 0 70px}
  .sec{padding:56px 0}
  .apps{grid-template-columns:1fr}
  .how{grid-template-columns:1fr}
  .nums{grid-template-columns:repeat(2,1fr);row-gap:28px}
  .app{padding:26px}
  .moon{display:none}
  .nt-back{padding:10px;align-items:flex-end}
  .nt{max-height:92vh;border-radius:24px}
  .nt-head{padding:24px 22px 14px}
  .nt-head h3{padding-right:36px}
  .nt-body{padding:18px 22px;font-size:15.5px}
  .nt-foot{padding:14px 22px 20px}
  .nt-close{width:100%}
  .nt-x{top:14px;right:14px}
}
@media (prefers-reduced-motion:reduce){.tw{animation:none}.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<svg id="sky" aria-hidden="true"></svg>
<div class="glow" style="width:600px;height:600px;background:#7a4fd1;opacity:.4;top:-150px;left:-150px"></div>
<div class="glow" style="width:500px;height:500px;background:#d45fa0;opacity:.25;top:30%;right:-180px"></div>
<div class="glow" style="width:650px;height:650px;background:#4f78d1;opacity:.22;bottom:-200px;left:-220px"></div>

<header>
  <div class="wrap">
    <nav>
      <a href="#top" class="logo" aria-label="HappyisIT">
        <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#f6c9e0"/><circle cx="27" cy="14" r="14" fill="#2a2163"/></svg>
        Happy is IT
      </a>
      <div class="menu">
        <a href="#apps" data-i18n="nav.apps"></a>
        <a href="#how" data-i18n="nav.how"></a>
        <a href="#story" data-i18n="nav.story"></a>
        <a href="#contact" data-i18n="nav.contact"></a>
      </div>
      <div class="lang" id="lang" role="group" aria-label="Language"></div>
    </nav>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <svg class="moon" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#fde6f1" stroke-opacity=".15"/><circle cx="50" cy="50" r="40" fill="#fde6f1"/><circle cx="66" cy="38" r="36" fill="#2a2163"/></svg>
    <span class="chip" data-i18n="hero.chip"></span>
    <h1 class="serif" data-i18n-html="hero.title"></h1>
    <p class="sub" data-i18n-html="hero.sub"></p>
    <div class="cta">
      <a href="#apps" class="btn b1" data-i18n="hero.cta1"></a>
      <a href="#how" class="btn b2" data-i18n="hero.cta2"></a>
    </div>
  </section>

  <section class="sec" id="apps">
    <p class="eyebrow">APPS</p>
    <h2 class="serif" data-i18n="apps.title"></h2>
    <p class="lead" data-i18n="apps.lead"></p>
    <div class="apps" id="appList"></div>
  </section>

  <section class="sec" id="how">
    <p class="eyebrow">HOW WE BUILD</p>
    <h2 class="serif" data-i18n="how.title"></h2>
    <p class="lead" data-i18n="how.lead"></p>
    <div class="how">
      <div class="pc reveal"><div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffc6e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M8.5 8.5A5 5 0 0 0 12 17h5a4 4 0 0 0 1.5-7.7M6 10a4 4 0 0 0-1 7.7"/></svg></div><h4 data-i18n="how.c1t"></h4><p data-i18n="how.c1d"></p></div>
      <div class="pc reveal"><div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d9c5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/><path d="M4 4l16 16"/></svg></div><h4 data-i18n="how.c2t"></h4><p data-i18n="how.c2d"></p></div>
      <div class="pc reveal"><div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a9dcff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3"/></svg></div><h4 data-i18n="how.c3t"></h4><p data-i18n="how.c3d"></p></div>
      <div class="pc reveal"><div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffd59e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div><h4 data-i18n="how.c4t"></h4><p data-i18n="how.c4d"></p></div>
    </div>
    <div class="note reveal">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a79ed4" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:2px" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <div><b data-i18n="how.noteT"></b><p data-i18n="how.noteD"></p></div>
    </div>
  </section>

  <section class="sec" style="padding-top:10px">
    <div class="nums reveal">
      <div class="n"><b class="serif" id="appCount">–</b><span data-i18n="num.apps"></span></div>
      <div class="n"><b class="serif">6</b><span data-i18n="num.langs"></span></div>
      <div class="n"><b class="serif">0</b><span data-i18n="num.signup"></span></div>
      <div class="n"><b class="serif">0</b><span data-i18n="num.server"></span></div>
    </div>
  </section>

  <section class="sec" id="story">
    <div class="letter reveal">
      <q class="serif" data-i18n-html="story.text"></q>
      <small data-i18n="story.sign"></small>
    </div>
  </section>
</main>

<footer id="contact">
  <div class="wrap">
    <div class="q" data-i18n="contact.q"></div>
    <a class="mail" href="mailto:happyisit@gmail.com">✉ happyisit@gmail.com</a>
    <div>© 2026 HappyisIT. All rights reserved.</div>
  </div>
</footer>

<div class="nt-back" id="ntBack" hidden>
  <div class="nt" id="nt" role="dialog" aria-modal="true" aria-labelledby="ntTitle">
    <button type="button" class="nt-x" id="ntX" aria-label="Close">×</button>
    <div class="nt-head">
      <span class="nt-badge" id="ntBadge"></span>
      <h3 class="serif" id="ntTitle"></h3>
      <div class="nt-date" id="ntDate"></div>
    </div>
    <div class="nt-body" id="ntBody"></div>
    <div class="nt-foot"><button type="button" class="nt-btn nt-close" id="ntClose"></button></div>
    <div class="nt-ask" id="ntAsk" hidden>
      <div class="nt-ask-box" role="alertdialog" aria-modal="true" aria-labelledby="ntAskQ">
        <p id="ntAskQ"></p>
        <div class="nt-ask-row">
          <button type="button" class="nt-btn nt-no" id="ntNo"></button>
          <button type="button" class="nt-btn nt-yes" id="ntYes"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const LANGS=[
  {code:"ko",html:"ko",label:"한국어"},
  {code:"en",html:"en",label:"EN"},
  {code:"zh",html:"zh-Hant",label:"繁中"},
  {code:"es",html:"es",label:"ES"},

  {code:"ru",html:"ru",label:"RU"}
];

const I18N={
ko:{
 "meta.title":"HappyisIT | 당신의 하루에 작은 별 하나",
 "nav.apps":"앱","nav.how":"만드는 방식","nav.story":"이야기","nav.contact":"문의",
 "hero.chip":"✦ 혼자서 완성해 가는 작은 앱 공방",

 "hero.cta1":"앱 둘러보기","hero.cta2":"만드는 방식",
 "apps.title":"함께 빛나는 별들","apps.lead":"하나씩 직접 만들고 다듬어 온 앱들입니다.",

 "apps.error":"앱 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.",

let lang="en", APPS=null, appsError=false;

function detectLang(){
  const q=new URLSearchParams(location.search).get("lang");
  if(q && I18N[q]) return q;
  try{const s=localStorage.getItem("hiit_lang"); if(s && I18N[s]) return s;}catch(e){}
  const ruRegions=["RU","BY","KZ","KG","UZ","TJ","TM","AM","AZ","MD","MN"];
  const ruLangs=["ru","be","kk","ky","uz","tg","tk","mn"];
  const prefs=navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||"en"];
  for(const p of prefs){
    const [l,r]=p.split("-"); const L=(l||"").toLowerCase(), R=(r||"").toUpperCase();
    if(L==="ko") return "ko";
    if(L==="zh") return "zh";
    if(L==="es"||L==="ca"||L==="gl") return "es";
    if(L==="pt") return "pt";
    if(ruLangs.includes(L) || ruRegions.includes(R)) return "ru";
    if(L==="en") return "en";
  }
  return "en";
}

function t(key){return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || "";}
function pick(v){ if(v==null) return ""; if(typeof v==="string"||Array.isArray(v)) return v; return v[lang] ?? v.en ?? v.ko ?? ""; }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function safeUrl(u){ return /^(https?:|mailto:|\.\/|\/|[a-z0-9_-]+\/)/i.test(u||"") && !/^javascript:/i.test(u) ? u : ""; }

function applyLang(){
  const meta=LANGS.find(l=>l.code===lang);
  document.documentElement.lang=meta.html;
  document.title=t("meta.title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml);});
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.code===lang));
  renderApps();
  renderNotice();
}

let NOTICE=null, lastFocus=null;
function nt(k){return (NOTICE_I18N[lang]||NOTICE_I18N.en)[k];}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>");
}
function noticeHasContent(n){
  if(!n || n.active===false) return false;
  return String(pick(n.title)||"").trim()!=="" || String(pick(n.body)||"").trim()!=="";
}
function renderNotice(){
  if(!noticeHasContent(NOTICE)) return;
  document.getElementById("ntBadge").textContent="⚠ "+nt("badge");
  document.getElementById("ntTitle").textContent=pick(NOTICE.title)||"";
  document.getElementById("ntDate").textContent=NOTICE.date||"";
  document.getElementById("ntBody").innerHTML=linkify(pick(NOTICE.body)||"");
  document.getElementById("ntClose").textContent=nt("close");
  document.getElementById("ntX").setAttribute("aria-label",nt("close"));
  document.getElementById("ntAskQ").textContent=nt("ask");
  document.getElementById("ntYes").textContent=nt("yes");
  document.getElementById("ntNo").textContent=nt("no");
}
function openNotice(){
  if(!noticeHasContent(NOTICE)) return;
  renderNotice();
  lastFocus=document.activeElement;
  document.getElementById("ntBack").hidden=false;
  document.body.classList.add("locked");
  document.getElementById("ntClose").focus();
}
function askClose(){
  document.getElementById("ntAsk").hidden=false;
  document.getElementById("ntNo").focus();
}
function answerNo(){
  document.getElementById("ntAsk").hidden=true;
  const box=document.getElementById("nt");
  box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  document.getElementById("ntBody").focus({preventScroll:true});
}
function answerYes(){
  document.getElementById("ntAsk").hidden=true;
  document.getElementById("ntBack").hidden=true;
  document.body.classList.remove("locked");
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById("ntBody").tabIndex=-1;
document.getElementById("ntClose").addEventListener("click",askClose);
document.getElementById("ntX").addEventListener("click",askClose);
document.getElementById("ntNo").addEventListener("click",answerNo);
document.getElementById("ntYes").addEventListener("click",answerYes);
document.getElementById("ntBack").addEventListener("click",e=>{ if(e.target.id==="ntBack") askClose(); });
document.addEventListener("keydown",e=>{
  if(document.getElementById("ntBack").hidden) return;
  if(e.key==="Escape"){ e.preventDefault(); if(document.getElementById("ntAsk").hidden) askClose(); else answerNo(); }
  if(e.key==="Tab"){
    const scope=document.getElementById("ntAsk").hidden?document.getElementById("nt"):document.getElementById("ntAsk");
    const f=[...scope.querySelectorAll("button,a[href]")].filter(x=>x.offsetParent!==null && (scope.id==="ntAsk"||!x.closest("#ntAsk")));
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){e.preventDefault(); last.focus();}
    else if(!e.shiftKey && document.activeElement===last){e.preventDefault(); first.focus();}
  }
});

function setLang(code){
  lang=code;
  try{localStorage.setItem("hiit_lang",code);}catch(e){}
  const u=new URL(location.href); u.searchParams.set("lang",code); history.replaceState(null,"",u);
  applyLang();
}

function renderApps(){
  const box=document.getElementById("appList");
  if(appsError){box.innerHTML='<p class="msg">'+esc(t("apps.error"))+'</p>';return;}
  if(!APPS){box.innerHTML="";return;}
  const list=APPS.filter(a=>a && a.visible!==false);
  document.getElementById("appCount").textContent=list.length;
  if(!list.length){box.innerHTML='<p class="msg">'+esc(t("apps.empty"))+'</p>';return;}
  box.innerHTML=list.map(a=>{
    const color=/^#[0-9a-f]{3,8}$/i.test(a.color||"")?a.color:"#b49bff";
    const name=pick(a.name), en=a.name && a.name.en ? a.name.en : "";
    const img=safeUrl(a.iconImage);
    const icon=img ? '<img src="'+esc(img)+'" alt="">' :
      '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[a.icon]||ICONS.heart)+'</svg>';
    const tags=(pick(a.tags)||[]).map(x=>'<span>'+esc(x)+'</span>').join("");
    const L=a.links||{}, links=[];
    if(safeUrl(L.play)) links.push('<a class="play" href="'+esc(L.play)+'" target="_blank" rel="noopener">Google Play</a>');
    if(safeUrl(L.privacy)) links.push('<a href="'+esc(L.privacy)+'" target="_blank" rel="noopener">'+esc(t("apps.privacy"))+'</a>');
    if(safeUrl(L.terms)) links.push('<a href="'+esc(L.terms)+'" target="_blank" rel="noopener">'+esc(t("apps.terms"))+'</a>');
    return '<article class="app reveal on" style="--c:'+color+'">'+
      '<div class="icon">'+icon+'</div>'+
      '<h3>'+esc(name)+'</h3>'+
      (en && en!==name ? '<div class="en">'+esc(en)+'</div>' : '<div class="en">&nbsp;</div>')+
      '<p>'+esc(pick(a.desc))+'</p>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      (links.length?'<div class="links">'+links.join("")+'</div>':'')+
      '</article>';
  }).join("");
}

function drawSky(){
  const svg=document.getElementById("sky");
  const w=window.innerWidth, h=window.innerHeight;
  svg.setAttribute("viewBox","0 0 "+w+" "+h);
  let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const count=Math.round(w*h/9000); let out="";
  for(let i=0;i<count;i++){
    const x=rnd()*w,y=rnd()*h,r=rnd()*1.6+.4,o=rnd()*.6+.25;
    const tw=rnd()<.25?' class="tw" style="animation-delay:'+(rnd()*4).toFixed(2)+'s"':'';
    out+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(2)+'" fill="#fff" opacity="'+o.toFixed(2)+'"'+tw+'/>';
  }
  const cols=["#ffc6e1","#d9c5ff","#a9dcff"];
  for(let i=0;i<Math.max(4,Math.round(w/180));i++){
    const x=rnd()*w,y=rnd()*h,s=6+rnd()*5,c=cols[i%3];
    out+='<path class="tw" style="animation-delay:'+(rnd()*4).toFixed(2)+'s" d="M'+x+' '+(y-s)+'L'+(x+s*.22)+' '+(y-s*.22)+'L'+(x+s)+' '+y+'L'+(x+s*.22)+' '+(y+s*.22)+'L'+x+' '+(y+s)+'L'+(x-s*.22)+' '+(y+s*.22)+'L'+(x-s)+' '+y+'L'+(x-s*.22)+' '+(y-s*.22)+'Z" fill="'+c+'"/>';
  }
  svg.innerHTML=out;
}

function setupReveal(){
  const els=document.querySelectorAll(".reveal:not(.on)");
  if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("on"));return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target);}}),{threshold:.12});
  els.forEach(e=>io.observe(e));
}

document.getElementById("lang").innerHTML=LANGS.map(l=>'<button type="button" data-code="'+l.code+'" lang="'+l.html+'">'+l.label+'</button>').join("");
document.getElementById("lang").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) setLang(b.dataset.code);});

lang=detectLang();
applyLang();
drawSky();
let rt; window.addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(drawSky,200);});
setupReveal();

fetch("apps.json",{cache:"no-cache"})
  .then(r=>{if(!r.ok) throw new Error(r.status); return r.json();})
  .then(d=>{APPS=Array.isArray(d)?d:(d.apps||[]); renderApps();})
  .catch(()=>{appsError=true; renderApps();});

fetch("urgent_notice.json",{cache:"no-store"})
  .then(r=>r.ok?r.json():null)
  .then(d=>{ if(d){ NOTICE=d; openNotice(); } })
  .catch(()=>{});
</script>
